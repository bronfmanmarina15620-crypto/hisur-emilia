<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הלימודים של אמיליה</title>
<script>
(function(){
  var dest = 'https://bronfmanmarina15620-crypto.github.io/limudim-emilia/hisur/seder/';
  function go(){ location.replace(dest + location.search + location.hash); }
  if (navigator.serviceWorker) {
    navigator.serviceWorker.getRegistrations().then(function(rs){
      return Promise.all(rs.map(function(r){ return r.unregister(); }));
    }).then(go, go);
  } else go();
})();
</script>
</head>
<body>
<p>התרגול עבר לאפליקציה המרכזית «הלימודים של אמיליה». אם לא עברת אוטומטית, <a id="g" href="https://bronfmanmarina15620-crypto.github.io/limudim-emilia/hisur/seder/">לחצי כאן</a>.</p>
<script>document.getElementById("g").href = 'https://bronfmanmarina15620-crypto.github.io/limudim-emilia/hisur/seder/' + location.search + location.hash;</script>
</body>
</html>
